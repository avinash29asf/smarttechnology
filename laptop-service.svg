<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect width="800" height="500" fill="#0b0f14"/>
  <!-- Opened laptop base (U shape) -->
  <rect x="120" y="300" width="560" height="60" rx="6" fill="#11161d" stroke="#232c38" stroke-width="2"/>
  <rect x="120" y="360" width="560" height="10" fill="#0b0f14"/>
  <!-- exposed motherboard/top case -->
  <rect x="130" y="150" width="540" height="150" rx="4" fill="#1a212b" stroke="#232c38" stroke-width="2"/>
  <!-- RAM module (green) -->
  <rect x="170" y="170" width="90" height="30" rx="2" fill="#4ade8c" stroke="#16a34a"/>
  <!-- SSD (silver) -->
  <rect x="280" y="170" width="120" height="30" rx="2" fill="#d3dae2" stroke="#9ca3af"/>
  <text x="410" y="190" font-family="Poppins,Arial,sans-serif" font-size="12" fill="#9ca3af">SSD</text>
  <!-- screws -->
  <circle cx="160" cy="175" r="4" fill="#d3dae2"/>
  <circle cx="160" cy="205" r="4" fill="#d3dae2"/>
  <circle cx="725" cy="175" r="4" fill="#d3dae2"/>
  <circle cx="725" cy="205" r="4" fill="#d3dae2"/>
  <!-- tools: screwdriver + spudger + thermal paste tube -->
  <line x1="580" y1="300" x2="660" y2="250" stroke="#d3dae2" stroke-width="10" stroke-linecap="round"/>
  <rect x="655" y="245" width="60" height="14" rx="7" fill="#d3dae2"/>
  <line x1="540" y1="300" x2="600" y2="320" stroke="#f97316" stroke-width="6" stroke-linecap="round"/>
  <rect x="605" y="318" width="8" height="40" fill="#f97316"/>
  <!-- thermal paste tube -->
  <rect x="430" y="300" width="26" height="14" rx="4" fill="#f97316"/>
  <rect x="456" y="300" width="14" height="14" rx="4" fill="#ea580c"/>
  <text x="400" y="460" font-family="Poppins,Arial,sans-serif" font-size="26" fill="#f97316" text-anchor="middle">Laptop Service</text>
</svg>