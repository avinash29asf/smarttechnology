<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect width="800" height="500" fill="#0b0f14"/>
  <!-- Laptop screen -->
  <rect x="175" y="80" width="450" height="240" rx="10" fill="#11161d" stroke="#232c38" stroke-width="2"/>
  <!-- Inner motherboard -->
  <rect x="270" y="130" width="260" height="140" rx="4" fill="#1a212b" stroke="#d3dae2" stroke-width="2"/>
  <rect x="290" y="160" width="80" height="40" rx="2" fill="#0f0f14" stroke="#d3dae2"/>
  <rect x="400" y="160" width="70" height="40" rx="2" fill="#0f0f14" stroke="#d3dae2"/>
  <line x1="270" y1="210" x2="530" y2="210" stroke="#374151" stroke-width="1"/>
  <rect x="320" y="220" width="60" height="12" rx="2" fill="#d3dae2"/>
  <rect x="400" y="220" width="60" height="12" rx="2" fill="#d3dae2"/>
  <!-- laptop base -->
  <rect x="250" y="360" width="300" height="50" rx="6" fill="#11161d" stroke="#232c38" stroke-width="2"/>
  <rect x="280" y="372" width="20" height="8" rx="2" fill="#232c38"/>
  <rect x="310" y="372" width="20" height="8" rx="2" fill="#232c38"/>
  <rect x="340" y="372" width="20" height="8" rx="2" fill="#232c38"/>
  <!-- crossed tools -->
  <g stroke="#d3dae2" stroke-width="6" stroke-linecap="round">
    <line x1="120" y1="300" x2="200" y2="220" transform="rotate(-15 160 260)"/>
    <line x1="200" y1="220" x2="280" y2="200" transform="rotate(-15 160 260)"/>
  </g>
  <g fill="#d3dae2">
    <rect x="595" y="270" width="40" height="40" rx="6" transform="rotate(20 615 290)"/>
    <rect x="580" y="300" width="70" height="22" rx="4" transform="rotate(20 615 311)"/>
  </g>
  <text x="400" y="470" font-family="Poppins,Arial,sans-serif" font-size="26" fill="#f97316" text-anchor="middle">Laptop Repair</text>
</svg>