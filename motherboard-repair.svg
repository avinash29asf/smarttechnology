<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect width="800" height="500" fill="#0b0f14"/>
  <!-- Motherboard -->
  <rect x="100" y="100" width="600" height="300" rx="10" fill="#11161d" stroke="#232c38" stroke-width="2"/>
  <!-- Processor / CPU -->
  <rect x="110" y="120" width="90" height="60" rx="3" fill="#1a212b" stroke="#d3dae2" stroke-width="2"/>
  <!-- RAM slots -->
  <rect x="220" y="120" width="40" height="60" rx="2" fill="#0f0f14" stroke="#d3dae2"/>
  <rect x="280" y="120" width="40" height="60" rx="2" fill="#0f0f14" stroke="#d3dae2"/>
  <!-- ICs -->
  <rect x="400" y="130" width="120" height="40" rx="2" fill="#1a212b" stroke="#f97316" stroke-width="2"/>
  <rect x="400" y="190" width="120" height="40" rx="2" fill="#1a212b" stroke="#d3dae2" stroke-width="2"/>
  <!-- Capacitors / Resistors -->
  <ellipse cx="560" cy="160" rx="12" ry="6" fill="#d3dae2"/>
  <rect x="560" y="200" width="4" height="24" fill="#d3dae2"/>
  <rect x="580" y="195" width="6" height="30" fill="#d3dae2"/>
  <!-- Power IC highlighted -->
  <rect x="640" y="180" width="50" height="40" rx="2" fill="#f97316" stroke="#ea580c"/>
  <!-- traces -->
  <line x1="200" y1="260" x2="600" y2="260" stroke="#374151" stroke-width="1"/>
  <line x1="350" y1="230" x2="350" y2="260" stroke="#374151" stroke-width="1"/>
  <!-- magnifier -->
  <circle cx="700" cy="130" r="40" fill="none" stroke="#d3dae2" stroke-width="3"/>
  <line x1="730" y1="160" x2="775" y2="205" stroke="#d3dae2" stroke-width="3" stroke-linecap="round"/>
  <!-- socket pin grid -->
  <g stroke="#374151" stroke-width="1">
    <line x1="120" y1="200" x2="160" y2="200"/>
    <line x1="120" y1="220" x2="160" y2="220"/>
    <line x1="120" y1="240" x2="160" y2="240"/>
  </g>
  <text x="400" y="460" font-family="Poppins,Arial,sans-serif" font-size="26" fill="#f97316" text-anchor="middle">Motherboard Repair</text>
</svg>