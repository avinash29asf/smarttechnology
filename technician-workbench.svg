<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect width="800" height="500" fill="#0b0f14"/>
  <!-- workbench surface -->
  <rect x="40" y="320" width="720" height="60" fill="#11161d" stroke="#232c38" stroke-width="2"/>
  <!-- solder station -->
  <rect x="120" y="230" width="70" height="90" rx="6" fill="#1a212b" stroke="#232c38"/>
  <line x1="155" y1="200" x2="155" y2="320" stroke="#d3dae2" stroke-width="6" stroke-linecap="round"/>
  <!-- soldering iron tip (heating) -->
  <line x1="155" y1="205" x2="175" y2="195" stroke="#f97316" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="178" cy="196" rx="8" ry="5" fill="#f97316"/>
  <!-- small PCB board being repaired -->
  <rect x="330" y="240" width="140" height="80" rx="4" fill="#0b0f14" stroke="#d3dae2" stroke-width="2"/>
  <rect x="350" y="260" width="24" height="16" rx="2" fill="#f97316"/>
  <rect x="380" y="260" width="30" height="16" rx="2" fill="#1a212b" stroke="#d3dae2"/>
  <!-- microscope -->
  <circle cx="510" cy="260" r="34" fill="none" stroke="#d3dae2" stroke-width="3"/>
  <line x1="510" y1="226" x2="510" y2="210" stroke="#d3dae2" stroke-width="3" stroke-linecap="round"/>
  <rect x="505" y="230" width="10" height="30" fill="#d3dae2"/>
  <!-- tools -->
  <g stroke="#d3dae2" stroke-width="6" stroke-linecap="round">
    <line x1="640" y1="250" x2="690" y2="280"/>
    <line x1="690" y1="280" x2="660" y2="310"/>
  </g>
  <text x="400" y="430" font-family="Poppins,Arial,sans-serif" font-size="24" fill="#9ca3af" text-anchor="middle">Repair Workstation</text>
  <text x="400" y="462" font-family="Poppins,Arial,sans-serif" font-size="22" fill="#f97316" text-anchor="middle">Chip-Level Technician</text>
</svg>