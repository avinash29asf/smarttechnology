<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect width="800" height="500" fill="#0b0f14"/>
  <!-- Monitor -->
  <rect x="200" y="70" width="400" height="220" rx="6" fill="#11161d" stroke="#232c38" stroke-width="2"/>
  <line x1="300" y1="290" x2="270" y2="330" stroke="#374151" stroke-width="2"/>
  <line x1="500" y1="290" x2="530" y2="330" stroke="#374151" stroke-width="2"/>
  <!-- Motherboard inside monitor face -->
  <rect x="280" y="120" width="240" height="120" rx="3" fill="#1a212b" stroke="#d3dae2"/>
  <rect x="300" y="140" width="60" height="30" rx="2" fill="#0f0f14" stroke="#d3dae2"/>
  <rect x="380" y="140" width="80" height="30" rx="2" fill="#0f0f14" stroke="#d3dae2"/>
  <circle cx="340" cy="175" r="12" fill="#f97316"/>
  <!-- Desktop tower -->
  <rect x="340" y="300" width="120" height="130" rx="6" fill="#11161d" stroke="#232c38" stroke-width="2"/>
  <!-- motherboard visible in tower side window -->
  <rect x="355" y="320" width="90" height="100" rx="2" fill="#1a212b" stroke="#d3dae2"/>
  <rect x="370" y="335" width="24" height="16" rx="2" fill="#f97316"/>
  <rect x="400" y="335" width="30" height="16" rx="2" fill="#d3dae2"/>
  <!-- power button -->
  <circle cx="418" cy="400" r="6" fill="#d3dae2"/>
  <text x="400" y="470" font-family="Poppins,Arial,sans-serif" font-size="26" fill="#f97316" text-anchor="middle">Desktop Repair</text>
</svg>